org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Forge 1.20.1 (official Mojang mappings), the loader Cracker's Wither Storm Mod 4.2.1 runs on
minecraft_version=1.20.1
forge_version=47.4.10

# Cracker's Wither Storm Mod: compiled against (never bundled). The folder holding
# witherstormmod-<witherstorm_version>-all.jar. Download it separately into libs/,
# or pass -Pwitherstorm_dir=<directory> when running Gradle.
witherstorm_version=1.20.1-4.2.1
witherstorm_dir=libs

version=0.1.0
group=dev.rehan.passthrough
